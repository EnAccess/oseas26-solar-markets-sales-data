[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-markets"
version = "0.1.0"
description = "Market-reality layer for the Energy Access Explorer: off-grid solar penetration and underserved-market rasters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3.9",
    "rasterstats>=0.19",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.45",
    "matplotlib>=3.8",
    "pillow>=10",
    "pyreadstat>=1.2",
    "openpyxl>=3.1",
    "earthengine-api>=0.1.390",
    "python-dotenv>=1.0",
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "jupyterlab>=4.0"]
gee = ["geemap>=0.32"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solar_markets = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
